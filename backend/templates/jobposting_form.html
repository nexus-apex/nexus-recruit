{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} JobPosting | NexusRecruit{% endblock %}
{% block page_title %}{% if editing %}Edit JobPosting{% else %}New JobPosting{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ record.title|default:'' }}">
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" name="department" value="{{ record.department|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" value="{{ record.location|default:'' }}">
      </div>
      <div class="form-group">
        <label>Job Type</label>
        <select name="job_type">
          <option value="full_time" {% if record.job_type == 'full_time' %}selected{% endif %}>Full Time</option>
          <option value="part_time" {% if record.job_type == 'part_time' %}selected{% endif %}>Part Time</option>
          <option value="contract" {% if record.job_type == 'contract' %}selected{% endif %}>Contract</option>
          <option value="internship" {% if record.job_type == 'internship' %}selected{% endif %}>Internship</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Salary Range</label>
        <input type="text" name="salary_range" value="{{ record.salary_range|default:'' }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="open" {% if record.status == 'open' %}selected{% endif %}>Open</option>
          <option value="closed" {% if record.status == 'closed' %}selected{% endif %}>Closed</option>
          <option value="on_hold" {% if record.status == 'on_hold' %}selected{% endif %}>On Hold</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Applications</label>
        <input type="number" name="applications" value="{{ record.applications|default:'0' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description">{{ record.description|default:'' }}</textarea>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} JobPosting</button>
      <a href="/jobpostings/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
