{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}New{% endif %} Interview | NexusRecruit{% endblock %}
{% block page_title %}{% if editing %}Edit Interview{% else %}New Interview{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:750px">
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Candidate Name</label>
        <input type="text" name="candidate_name" value="{{ record.candidate_name|default:'' }}">
      </div>
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" name="job_title" value="{{ record.job_title|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Interviewer</label>
        <input type="text" name="interviewer" value="{{ record.interviewer|default:'' }}">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="date" value="{{ record.date|date:'Y-m-d'|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mode</label>
        <select name="mode">
          <option value="in_person" {% if record.mode == 'in_person' %}selected{% endif %}>In Person</option>
          <option value="video" {% if record.mode == 'video' %}selected{% endif %}>Video</option>
          <option value="phone" {% if record.mode == 'phone' %}selected{% endif %}>Phone</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="scheduled" {% if record.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
          <option value="completed" {% if record.status == 'completed' %}selected{% endif %}>Completed</option>
          <option value="cancelled" {% if record.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Rating</label>
        <input type="number" name="rating" value="{{ record.rating|default:'0' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Feedback</label>
      <textarea name="feedback">{{ record.feedback|default:'' }}</textarea>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1rem">
      <button type="submit" class="btn btn-primary">{% if editing %}Update{% else %}Create{% endif %} Interview</button>
      <a href="/interviews/" class="btn" style="background:var(--border);color:var(--text)">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
